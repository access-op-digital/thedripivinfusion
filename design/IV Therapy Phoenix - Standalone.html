document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"background:#fff;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:16px;align-items:center\">\n          <image-slot id=\"team-brandon\" shape=\"circle\" style=\"width:84px;height:84px;flex:none\" placeholder=\"Brandon\"><\u002Fimage-slot>\n          <div><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:21px;color:#153060\">Brandon Lang, MSN, RN<\u002Fh3><div style=\"font-size:14px;color:#5A79AD;font-weight:600\">Co-founder &amp; CEO<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:16px;line-height:1.55;color:#3a4150\">14 years in emergency departments and 17 years in air medical and flight nursing — the source of the habit of carrying a full infusion kit to an unpredictable address.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:16px;align-items:center\">\n          <image-slot id=\"team-corbin\" shape=\"circle\" style=\"width:84px;height:84px;flex:none\" placeholder=\"Corbin\"><\u002Fimage-slot>\n          <div><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:21px;color:#153060\">Corbin King, MBA, RN<\u002Fh3><div style=\"font-size:14px;color:#5A79AD;font-weight:600\">Co-founder &amp; COO<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:16px;line-height:1.55;color:#3a4150\">Seven years as a paramedic and firefighter, flight paramedic since 2010. His operational background sets the dispatch model behind the 60-minute Phoenix response.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#153060;color:#fff;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:8px\">\n          <image-slot id=\"team-jenna\" shape=\"circle\" style=\"width:64px;height:64px;flex:none\" placeholder=\"Jenna\"><\u002Fimage-slot>\n          <image-slot id=\"team-karena\" shape=\"circle\" style=\"width:64px;height:64px;flex:none\" placeholder=\"Karena\"><\u002Fimage-slot>\n          <image-slot id=\"team-kris\" shape=\"circle\" style=\"width:64px;height:64px;flex:none\" placeholder=\"Kris\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:21px\">The Nurses Who Run Your Phoenix Infusion<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.55;color:#dbe6f5\">Jenna, Karena and Kris cover the Phoenix rota — each a licensed RN with specialised IV training. Your nurse stays for the full 45 to 60 minutes. Claudia Martinez credits Kris with arriving inside the hour.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08 Safety\" style=\"padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:36px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n      <p style=\"font-family:Questrial,sans-serif;font-size:clamp(28px,3.2vw,38px);line-height:1.2\">Every line at a Phoenix address is placed by a licensed RN, <span style=\"color:#5A79AD\">under a valid prescriber's order.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:0;border-bottom:1px solid #dfe4ec;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ safety0.click }}\" style=\"background:transparent;border:0;cursor:pointer;padding:14px 22px;font:600 16px 'Source Sans 3',sans-serif;color:{{ safety0.tfg }};border-bottom:3px solid {{ safety0.line }};margin-bottom:-1px\">Credentials &amp; Safety<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ safety1.click }}\" style=\"background:transparent;border:0;cursor:pointer;padding:14px 22px;font:600 16px 'Source Sans 3',sans-serif;color:{{ safety1.tfg }};border-bottom:3px solid {{ safety1.line }};margin-bottom:-1px\">Do I Need a Prescription?<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ safety2.click }}\" style=\"background:transparent;border:0;cursor:pointer;padding:14px 22px;font:600 16px 'Source Sans 3',sans-serif;color:{{ safety2.tfg }};border-bottom:3px solid {{ safety2.line }};margin-bottom:-1px\">Nurse Scope &amp; Oversight<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:start\">\n      <div>\n        <sc-if value=\"{{ safety0.on }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <h2 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:30px;line-height:1.2;color:#153060\">Our Clinical Credentials and Safety Standards<\u002Fh2>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">100% of administering clinicians are licensed RNs. The practice is fully licensed and insured, and treatments run under MD-supervised protocols. Nurses hold current Arizona licences and specialised IV infusion training.<\u002Fp>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">Sterile technique travels with the nurse. Single-use catheters, sealed bags and sharps disposal come in the kit and leave with it.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <div style=\"background:#F6F6F6;border-radius:10px;padding:16px;font-size:15px;color:#153060;font-weight:600\">Licensed &amp; insured<\u002Fdiv>\n              <div style=\"background:#F6F6F6;border-radius:10px;padding:16px;font-size:15px;color:#153060;font-weight:600\">MD-supervised protocols<\u002Fdiv>\n              <div style=\"background:#F6F6F6;border-radius:10px;padding:16px;font-size:15px;color:#153060;font-weight:600\">Single-use sterile kit<\u002Fdiv>\n              <div style=\"background:#F6F6F6;border-radius:10px;padding:16px;font-size:15px;color:#153060;font-weight:600\">Nurse stays full infusion<\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:15px;color:#3a4150\">Read more on <a href=\"#\" style=\"text-decoration:underline\">sterile IV safety<\u002Fa> and <a href=\"#\" style=\"text-decoration:underline\">whether IV drips are safe<\u002Fa>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ safety1.on }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <h2 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:30px;line-height:1.2;color:#153060\">Do You Need a Prescription for IV Therapy in Arizona?<\u002Fh2>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\"><strong>Yes.<\u002Fstrong> Arizona requires a valid order from a licensed prescriber before a nurse may run an elective IV hydration or nutrient infusion — in a clinic or in your Phoenix living room.<\u002Fp>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">Under A.A.C. R4-19-402 and the Arizona State Board of Nursing advisory opinion, the order must come from a physician, PA or APRN, be individualised to you, and carry a medical rationale. A generic menu selection doesn't satisfy it.<\u002Fp>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">A good faith exam comes before the order; blanket standing orders don't meet the standard. For you, paperwork happens before the needle: intake, exam, order, then infusion.<\u002Fp>\n            <p style=\"font-size:15px;color:#3a4150\">Related: <a href=\"#\" style=\"text-decoration:underline\">prescription requirements<\u002Fa>, <a href=\"#\" style=\"text-decoration:underline\">who can administer IV therapy<\u002Fa>, <a href=\"#\" style=\"text-decoration:underline\">IV therapy regulations<\u002Fa>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ safety2.on }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:30px;line-height:1.2;color:#153060\">What an Arizona Nurse Can and Can't Do<\u002Fh3>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">It is outside an Arizona RN or LPN scope to independently order, compound or prescribe IV fluids, medications or regimens, or to make an independent medical diagnosis. Anything outside the order goes back to the prescriber.<\u002Fp>\n            <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">Arizona also expects an IV hydration business operating outside a private medical office or clinic to retain a licensed medical professional with full practice authority as its medical director.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:420px;border-radius:10px;overflow:hidden\"><image-slot id=\"safety-kit\" shape=\"rect\" placeholder=\"Sealed single-use IV kit and sharps container on a clean surface\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"process\" data-screen-label=\"09 Process\" style=\"background:#153060;color:#fff;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n      <h2 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1.15\">What Happens During Your <span style=\"color:#B5DEF5\">Phoenix IV Appointment<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">Eight steps from booking call to follow-up. About 45 to 60 minutes once the nurse arrives.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"height:3px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden\"><div style=\"height:100%;background:#B5DEF5;width:{{ stepPct }};transition:width 300ms cubic-bezier(0.4,0,0.2,1)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px\">\n        <button sc-camel-on-click=\"{{ step0.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step0.bg }};color:{{ step0.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">01<\u002Fspan>Book<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step1.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step1.bg }};color:{{ step1.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">02<\u002Fspan>Health intake<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step2.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step2.bg }};color:{{ step2.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">03<\u002Fspan>Nurse arrives<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step3.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step3.bg }};color:{{ step3.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">04<\u002Fspan>Vitals &amp; consult<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step4.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step4.bg }};color:{{ step4.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">05<\u002Fspan>Drip selection<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step5.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step5.bg }};color:{{ step5.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">06<\u002Fspan>Infusion<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step6.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step6.bg }};color:{{ step6.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">07<\u002Fspan>Post-care check<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ step7.click }}\" style=\"cursor:pointer;text-align:left;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:{{ step7.bg }};color:{{ step7.fg }};font:600 15px 'Source Sans 3',sans-serif;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:Questrial,sans-serif;font-size:22px\">08<\u002Fspan>Follow-up<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:32px;align-items:center;background:rgba(255,255,255,0.06);border-radius:10px;padding:32px\">\n      <div>\n        <sc-if value=\"{{ step0.on }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 1 — Book<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">Call or text (602) 341-3511, email hello@thedripivinfusion.com, or book online. Lines are staffed 7:00AM to 9:00PM, seven days a week.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step1.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 2 — Health intake<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">A health history covering medications, allergies, pregnancy status and prior reactions. Arizona's required good faith exam and individualised order are set up here.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step2.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 3 — Nurse arrives<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">A licensed RN travels to your home, office or hotel, typically within 60 minutes. Coverage spans the 85003–85020 ZIPs and the surrounding metro.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step3.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 4 — Vitals and consult<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">Blood pressure, pulse and temperature, reviewed against your order. Anything outside the order goes back to the prescriber.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step4.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 5 — Drip selection<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">Confirm the drip and any $30 add-ons against the order on file. The eight bags run $195 to $495.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step5.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 6 — Infusion, 30 to 60 minutes<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">The nurse places the catheter, starts the infusion and stays with you throughout. Sit, work or lie down — the line runs the same.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step6.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 7 — Post-care check<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">Catheter removed, vitals rechecked, no site pain, dizziness or swelling confirmed. Sharps and used supplies leave with the nurse.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ step7.on }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:12px\"><h3 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:28px\">Step 8 — Follow-up<\u002Fh3><p style=\"font-size:18px;line-height:1.6;color:#dbe6f5\">A text or call confirms how you responded and logs anything for next time. After-hours questions go to (602) 341-3511.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:relative;height:300px;border-radius:10px;overflow:hidden\"><image-slot id=\"process-visual\" shape=\"rect\" placeholder=\"Nurse checking vitals before a Phoenix home infusion\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-screen-label=\"12 Reasons\" style=\"background:#F6F6F6;padding:96px 24px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"font-family:Questrial,sans-serif;font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1.15\">Common Reasons Phoenix Residents <span style=\"color:#5A79AD\">Book IV Therapy<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.6;color:#2b3140\">Phoenix recorded 100F earlier in 2026 than at any point in its history — an eight-day triple-digit run from 18 to 25 March, three consecutive days at 105F. March 2026 finished as the hottest March on record.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;background:#fff;padding:6px;border-radius:12px;flex-wrap:wrap;align-self:flex-start;border:1px solid #e3e7ee\">\n      <sc-for list=\"{{ reasonTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ t.click }}\" style=\"border:0;cursor:pointer;padding:12px 22px;border-radius:8px;font:600 14px 'Source Sans 3',sans-serif;letter-spacing:1px;text-transform:uppercase;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px;align-items:stretch\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ reasonItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff;border-radius:10px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start\">\n            <div style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#B5DEF5;color:#153060;display:flex;align-items:center;justify-content:center;font-family:Questrial,sans-serif;font-size:16px\">{{ it.n }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-f
